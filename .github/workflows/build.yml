name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install Geode CLI
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -o geode-cli.zip
          unzip geode-cli.zip -d /usr/local/bin
          chmod +x /usr/local/bin/geode

      - name: Install Geode SDK
        run: |
          geode sdk install /home/runner/geode-sdk
          geode sdk set-path /home/runner/geode-sdk
          geode sdk install-binaries -p android64

      - name: Build .geode mod
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          geode build -p android64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: antarupdey81.object-stripper-android64
          path: build-android64/*.geode