name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install Geode CLI
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/geode-sdk/cli/releases/latest | grep -E "browser_download_url.*linux.*(x86_64|amd64).*\.zip" | head -n 1 | cut -d '"' -f 4)
          if [ -z "$CLI_URL" ]; then
            CLI_URL=$(curl -s https://api.github.com/repos/geode-sdk/cli/releases/latest | grep "browser_download_url.*linux.*\.zip" | grep -v "arm" | head -n 1 | cut -d '"' -f 4)
          fi
          echo "Downloading $CLI_URL"
          curl -fL "$CLI_URL" -o geode-cli.zip
          sudo unzip -o geode-cli.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/geode

      - name: Install Geode SDK
        run: |
          mkdir -p ~/.config/geode /tmp/gd
          cat << 'EOF' > ~/.config/geode/config.json
          {
            "current-profile": "default",
            "profiles": {
              "default": {
                "gd-path": "/tmp/gd",
                "platform": "android64"
              }
            },
            "sdk-nightly": false
          }
          EOF
          geode sdk install /home/runner/geode-sdk
          geode sdk set-path /home/runner/geode-sdk
          geode sdk install-binaries -p android64

      - name: Build .geode mod
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          GEODE_SDK: /home/runner/geode-sdk
        run: |
          geode build -p android64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: antarupdey81.object-stripper-android64
          path: build-android64/*.geode