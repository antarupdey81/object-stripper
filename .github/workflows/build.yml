name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: true

      - name: Install Geode CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLI_URL=$(gh release view --repo geode-sdk/cli --json assets --jq '.assets[] | select(.name | test("linux.*(x86_64|amd64).*\\.zip$")) | .url' | head -n 1)
          if [ -z "$CLI_URL" ]; then
            CLI_URL=$(gh release view --repo geode-sdk/cli --json assets --jq '.assets[] | select(.name | test("linux.*\\.zip$")) | select(.name | test("arm") | not) | .url' | head -n 1)
          fi
          echo "Downloading $CLI_URL"
          curl -fL "$CLI_URL" -o geode-cli.zip
          sudo unzip -o geode-cli.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/geode

      - name: Install Geode SDK
        run: |
          mkdir -p /tmp/gd/geode/mods
          touch /tmp/gd/GeometryDash.exe
          geode profile add --name default /tmp/gd win
          geode profile switch default
          geode sdk install /home/runner/geode-sdk
          git -C /home/runner/geode-sdk fetch --tags
          git -C /home/runner/geode-sdk checkout v5.11.2
          export GEODE_SDK=/home/runner/geode-sdk
          geode sdk set-path /home/runner/geode-sdk
          geode sdk install-binaries -p android64

      - name: Build .geode mod
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          GEODE_SDK: /home/runner/geode-sdk
        run: |
          geode build -p android64 -- -DCMAKE_BUILD_TYPE=Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: antarupdey81.object-stripper-android64
          path: build-android64/*.geode